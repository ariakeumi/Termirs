workspace.credential.public_key_copied:
  zh-CN: 已复制公钥
  en: Copied the public key
workspace.credential.public_key_unreadable:
  zh-CN: 无法从 %{path} 读出公钥
  en: Couldn’t read a public key from %{path}
workspace.credential.in_use_then_password.one:
  en: 1 host uses this credential. Once it’s deleted, that host switches to Password, asks for the password when connecting, and keeps its username.
workspace.credential.in_use_then_password.other:
  zh-CN: 有 %{count} 台主机正在使用此凭据。删除后它们改为「密码」，连接时询问密码，用户名不变。
  en: "%{count} hosts use this credential. Once it’s deleted, they switch to Password, ask for the password when connecting, and keep their usernames."
workspace.credential.in_use_then_no_password.one:
  en: 1 host uses this credential. Once it’s deleted, that host switches to No password, signs in with the SSH agent and the private keys in ~/.ssh, and keeps its username.
workspace.credential.in_use_then_no_password.other:
  zh-CN: 有 %{count} 台主机正在使用此凭据。删除后它们改为「无密码」，用 SSH Agent 和 ~/.ssh 中的私钥登录，用户名不变。
  en: "%{count} hosts use this credential. Once it’s deleted, they switch to No password, sign in with the SSH agent and the private keys in ~/.ssh, and keep their usernames."

