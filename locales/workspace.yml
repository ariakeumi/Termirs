# Changes not saved yet, which a close or a quit would lose. `files` is
# one of the workspace.files phrases.
workspace.files.single:
  zh-CN: “%{name}”
  en: “%{name}”
workspace.files.pair:
  zh-CN: “%{first}”和“%{second}”
  en: “%{first}” and “%{second}”
workspace.files.several:
  zh-CN: “%{first}”等 %{count} 个文件
  en: "%{count} files including “%{first}”"
workspace.unsaved.quit_title:
  zh-CN: 退出 Termirs？
  en: Quit Termirs?
workspace.unsaved.quit:
  zh-CN: "%{files}有未保存的修改，退出后会丢失。"
  en: Unsaved changes to %{files} will be lost.
workspace.unsaved.discard_and_quit:
  zh-CN: 放弃修改并退出
  en: Discard changes and quit
workspace.unsaved.close_tabs_title.one:
  en: Close 1 tab?
workspace.unsaved.close_tabs_title.other:
  zh-CN: 关闭 %{count} 个标签？
  en: Close %{count} tabs?
workspace.unsaved.close_tabs:
  zh-CN: "%{files}有未保存的修改，关闭后会丢失。"
  en: Unsaved changes to %{files} will be lost.
workspace.unsaved.close_sftp_title:
  zh-CN: 关闭 SFTP 标签？
  en: Close the SFTP tab?
workspace.unsaved.close_sftp:
  zh-CN: "%{files}有未保存的修改，关闭 SFTP 标签会一起关掉它们，修改会丢失。"
  en: Closing the SFTP tab also closes %{files}. Unsaved changes will be lost.
workspace.unsaved.close_terminal_title:
  zh-CN: 关闭终端？
  en: Close the terminal?
workspace.unsaved.close_terminal:
  zh-CN: "%{files}有未保存的修改，关闭终端会一起关掉它们，修改会丢失。"
  en: Closing the terminal also closes %{files}. Unsaved changes will be lost.
workspace.unsaved.discard_and_close:
  zh-CN: 放弃修改并关闭
  en: Discard changes and close

