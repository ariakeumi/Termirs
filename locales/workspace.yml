# Questions while connecting.
workspace.host_key.unknown_title:
  zh-CN: 首次连接此主机
  en: First connection to this host
workspace.host_key.trust:
  zh-CN: 信任并连接
  en: Trust and connect
workspace.host_key.changed_title:
  zh-CN: 服务器主机密钥已变更
  en: Server host key changed
workspace.host_key.changed:
  zh-CN: "主机：%{host}:%{port}\n算法：%{algorithm}\n已保存指纹：%{old}\n服务器当前指纹：%{fingerprint}\n\n服务器重装过或换过密钥时，更新后即可连接。否则可能有人在冒充这台服务器，请先核实。"
  en: "Host: %{host}:%{port}\nAlgorithm: %{algorithm}\nSaved fingerprint: %{old}\nServer’s fingerprint now: %{fingerprint}\n\nIf the server was reinstalled or its keys were replaced, update the saved key to connect. Otherwise someone may be posing as the server, so verify it first."
workspace.host_key.changed_via_jump_host:
  zh-CN: "跳板主机：%{jump_host}\n主机：%{host}:%{port}\n算法：%{algorithm}\n已保存指纹：%{old}\n服务器当前指纹：%{fingerprint}\n\n服务器重装过或换过密钥时，更新后即可连接。否则可能有人在冒充这台服务器，请先核实。"
  en: "Jump host: %{jump_host}\nHost: %{host}:%{port}\nAlgorithm: %{algorithm}\nSaved fingerprint: %{old}\nServer’s fingerprint now: %{fingerprint}\n\nIf the server was reinstalled or its keys were replaced, update the saved key to connect. Otherwise someone may be posing as the server, so verify it first."
# Replaces the saved keys of the host with the one it shows now.
workspace.host_key.update:
  zh-CN: 更新并连接
  en: Update and connect
